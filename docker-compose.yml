# Badge Admin — Dokploy (Docker Compose)
# Environment sekmesine SUPABASE_URL ve SUPABASE_ANON_KEY yazılmazsa deploy açık bir hata mesajıyla durur.
# Domain'i Dokploy'un Domains sekmesinden ekle: servis "badge-admin", port 3000.

services:
  badge-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: badge-admin:latest
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Environment sekmesine SUPABASE_URL yaz}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Environment sekmesine SUPABASE_ANON_KEY yaz}
      ADMIN_TIMEZONE: ${ADMIN_TIMEZONE:-Europe/Istanbul}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    expose:
      - "3000"
    # Güvenlik sıkılaştırması
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
